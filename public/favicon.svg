<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- Top slab radiant royal gradient -->
    <linearGradient id="dd-top-grad" x1="5" y1="2.5" x2="27" y2="15.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Core glowing bracket gradient -->
    <linearGradient id="dd-core-grad" x1="7" y1="16" x2="25" y2="21" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Base slab gradient -->
    <linearGradient id="dd-base-grad" x1="5" y1="21" x2="27" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Ambient glow filter -->
    <filter id="dd-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#2563eb" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- 1. Floating Top Isometric Cap -->
  <g filter="url(#dd-glow)">
    <!-- Top Rhombus Face -->
    <path
      d="M 16 2.5 L 27 8.5 L 16 14.5 L 5 8.5 Z"
      fill="url(#dd-top-grad)"
      stroke="#93c5fd"
      stroke-width="0.75"
      stroke-linejoin="round"
    />
    <!-- Left Facet -->
    <path
      d="M 5 8.5 L 16 14.5 L 16 17 L 5 11 Z"
      fill="#1d4ed8"
    />
    <!-- Right Facet -->
    <path
      d="M 27 8.5 L 16 14.5 L 16 17 L 27 11 Z"
      fill="#2563eb"
    />
  </g>

  <!-- 2. Middle Layer: Integrated Developer Code Chevrons & Core Prism -->
  <!-- Left Chevron '<' facet -->
  <path
    d="M 6 13 L 13 17 L 13 19.5 L 6 15.5 Z"
    fill="url(#dd-core-grad)"
    stroke="#bfdbfe"
    stroke-width="0.5"
    stroke-linejoin="round"
  />
  <!-- Right Chevron '>' facet -->
  <path
    d="M 26 13 L 19 17 L 19 19.5 L 26 15.5 Z"
    fill="url(#dd-core-grad)"
    stroke="#bfdbfe"
    stroke-width="0.5"
    stroke-linejoin="round"
  />
  <!-- Center Core Diamond Prism -->
  <path
    d="M 16 15 L 20 17.5 L 16 20 L 12 17.5 Z"
    fill="#0f172a"
    stroke="#60a5fa"
    stroke-width="0.75"
    stroke-linejoin="round"
  />

  <!-- 3. Bottom Isometric Foundation Base Slab -->
  <!-- Base Top Lip -->
  <path
    d="M 5 21 L 16 17.5 L 27 21 L 16 24.5 Z"
    fill="#1e3a8a"
    opacity="0.8"
  />
  <!-- Base Left Facet -->
  <path
    d="M 5 21 L 16 25 L 16 28.5 L 5 24.5 Z"
    fill="#1e40af"
    stroke="#3b82f6"
    stroke-width="0.5"
    stroke-linejoin="round"
  />
  <!-- Base Right Facet -->
  <path
    d="M 27 21 L 16 25 L 16 28.5 L 27 24.5 Z"
    fill="url(#dd-base-grad)"
    stroke="#60a5fa"
    stroke-width="0.5"
    stroke-linejoin="round"
  />
</svg>
